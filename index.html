/* Tear the entrance down once it has played, so nothing lingers in a
   mid-animation state and no animation can ever replay. */
(function () {
  var root = document.documentElement;
  if (!root.classList.contains('anim')) return;

  var done = false;
  function teardown() {
    if (done) return;
    done = true;
    root.classList.remove('anim');
  }

  var last = document.querySelector('.logos svg:nth-child(3)');
  if (last) last.addEventListener('animationend', teardown, { once: true });
  setTimeout(teardown, 2600);
})();
</script>

<script>
/* ---------------------------------------------------------------------
   Live chat — posts to /api/chat, which proxies OpenAI server-side.
   The API key never reaches the browser.
   --------------------------------------------------------------------- */
(function () {
  'use strict';

  var card = document.getElementById('card');
  var input = document.getElementById('composerInput');
  var log = document.getElementById('chatLog');
  var send = document.getElementById('sendBtn');
  if (!card || !input || !log || !send) return;

  var history = [];
  var busy = false;

  function scrollDown() { log.scrollTop = log.scrollHeight; }

  function addMsg(kind, text) {
    var row = document.createElement('div');
    row.className = 'msg ' + kind;
    var bub = document.createElement('div');
    bub.className = 'bub';
    bub.textContent = text;
    row.appendChild(bub);
    log.appendChild(row);
    scrollDown();
    return bub;
  }

  function fail(bub, message) {
    bub.parentNode.className = 'msg err';
    bub.textContent = message;
    scrollDown();
  }

  function grow() {
    if (!card.classList.contains('live')) return;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.22) + 'px';
  }

  input.addEventListener('input', grow);

  input.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      submit();
    }
  });

  send.addEventListener('click', submit);

  async function submit() {
    if (busy) return;

    var text = input.value.trim();
    if (!text) { input.focus(); return; }

    card.classList.add('live');
    input.value = '';
    grow();

    addMsg('me', text);
    history.push({ role: 'user', content: text });

    busy = true;
    send.disabled = true;

    var bub = addMsg('ai', '');
    bub.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';

    var answer = '';

    try {
      var response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });

      if (!response.ok || !response.body) {
        var payload = await response.json().catch(function () { return {}; });
        fail(bub, payload.error || 'Something went wrong.');
        return;
      }

      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';

      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;

        buffer += decoder.decode(chunk.value, { stream: true });

        var index;
        while ((index = buffer.indexOf('\n\n')) !== -1) {
          var frame = buffer.slice(0, index).trim();
          buffer = buffer.slice(index + 2);

          if (frame.indexOf('data:') !== 0) continue;
          var data = frame.slice(5).trim();
          if (data === '[DONE]') continue;

          try {
            var parsed = JSON.parse(data);
            if (parsed.error) { fail(bub, parsed.error); return; }
            if (parsed.t) {
              answer += parsed.t;
              bub.textContent = answer;
              scrollDown();
            }
          } catch (e) { /* partial frame */ }
        }
      }

      if (!answer) fail(bub, 'No reply came back.');
      else history.push({ role: 'assistant', content: answer });
    } catch (e) {
      fail(bub, 'Connection lost. Try again.');
    } finally {
      busy = false;
      send.disabled = false;
    }
  }
})();
</script>
