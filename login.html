<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Log in to Aurora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./auth.css">
</head>
<body>

<a class="back" href="./index.html">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
  Back
</a>

<main>

  <!-- ------------------------------------------------ left: hero + video -->
  <div class="hero">
    <video autoplay muted loop playsinline>
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260506_081238_406ed0e3-5d83-436e-a512-0bbff7ec5b95.mp4" type="video/mp4">
    </video>

    <div class="hero-content">
      <a class="brand" href="./index.html">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle></svg>
        <span>Aurora</span>
      </a>

      <div class="hero-heading">
        <h1>Welcome back</h1>
        <p>Pick up your reasoning exactly where you left it.</p>
      </div>

      <div class="steps">
        <div class="step active"><span class="num">1</span><span class="txt">Verify your identity</span></div>
        <div class="step idle"><span class="num">2</span><span class="txt">Open your studio</span></div>
        <div class="step idle"><span class="num">3</span><span class="txt">Resume your work</span></div>
      </div>
    </div>
  </div>

  <!-- ------------------------------------------------------ right: form -->
  <div class="form-col">
    <div class="form-inner">

      <div class="head">
        <h2>Log In</h2>
        <p>Enter your details to return to your space.</p>
      </div>

      <div class="socials">
        <button class="social" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="4"></circle><line x1="21.17" y1="8" x2="12" y2="8"></line><line x1="3.95" y1="6.06" x2="8.54" y2="14"></line><line x1="10.88" y1="21.94" x2="15.46" y2="14"></line></svg>
          Google
        </button>
        <button class="social" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
          Github
        </button>
      </div>

      <div class="divider"><div class="line"></div><span>Or</span></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="jane@aurora.com" autocomplete="email">
        </div>

        <div class="field">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="#">Forgot password?</a>
          </div>
          <div class="pw">
            <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password">
            <button class="eye" type="button" data-toggle="password" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button class="submit" type="submit">Sign In</button>
      </form>

      <p class="foot">New to Aurora? <a href="./signup.html">Create an account</a></p>

    </div>
  </div>

</main>

<script src="./auth.js"></script>
</body>
</html>
